# Codemagic builds the iPhone app in the cloud (on a Mac) and uploads it to App Store Connect / TestFlight.
# Every push to main starts a build automatically.
# Code signing is automatic: Codemagic creates the certificate and App Store profile itself
# using the App Store Connect API key "AndyWorldsKey" (Team settings > Integrations > Developer Portal).
workflows:
  ios-app-store:
    name: Andy's Worlds - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AndyWorldsKey
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.andy-signing
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: Copy fonts
        script: npm run fonts
      - name: Create iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon and splash screen
        script: npm run icons
      - name: iPhone only, portrait only, no encryption question
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Andy's Worlds" $PLIST || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Andy's Worlds" $PLIST
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Sync web game into the app
        script: npx cap sync ios
      - name: Code signing (automatic - Codemagic creates certificate and profile itself)
        script: |
          set -e
          keychain initialize
          KEY_DIR="$HOME/.andy-signing"
          mkdir -p "$KEY_DIR"
          if [ ! -f "$KEY_DIR/cert_key.pem" ]; then
            echo "No saved signing key yet - creating one (it is kept in the Codemagic cache)"
            ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_DIR/cert_key.pem" -q -N ""
          fi
          app-store-connect fetch-signing-files "com.ktsunshine.andysworlds" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$KEY_DIR/cert_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
          sed -i '' 's/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.2;/g' App.xcodeproj/project.pbxproj
      - name: Build the app (.ipa)
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
