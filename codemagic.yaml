# Codemagic builds the iPhone app in the cloud (on a Mac) and uploads it to App Store Connect / TestFlight.
# Before the first build, in Codemagic:
#   1. Team settings > Integrations > Developer Portal: add your App Store Connect API key, name it  AndyWorldsKey
#   2. Team settings > Code signing identities: generate an "Apple Distribution" certificate and fetch the
#      App Store provisioning profile for com.ktsunshine.andysworlds
workflows:
  ios-app-store:
    name: Andy's Worlds - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AndyWorldsKey
    environment:
      ios_signing:
        provisioning_profiles:
          - andy_profile
        certificates:
          - andy_dist
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: Copy fonts
        script: npm run fonts
      - name: Create iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon and splash screen
        script: npm run icons
      - name: iPhone only, portrait only, no encryption question
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Andy's Worlds" $PLIST || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Andy's Worlds" $PLIST
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Sync web game into the app
        script: npx cap sync ios
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the app (.ipa)
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
