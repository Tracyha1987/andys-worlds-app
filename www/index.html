<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Andy's Worlds</title>
<meta name="description" content="Andy's Worlds 3.0 — learning boss-battle adventure for grades 4–10">
<meta name="theme-color" content="#0d1a52">
<style>
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/baloo-2-vietnamese-500-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/baloo-2-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-vietnamese-700-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-vietnamese-800-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: phone-shaped game frame (centered on desktop, full-bleed on phones); one committed night-sky candy look */
:root{
  --gold:#ffd54a;--mint:#4fe3a0;--rose:#ff5f86;--ink:#1b2855;--paper:#fffaf0;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--display);background:#070c30;color:#fff}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{cursor:default}
img{display:block;max-width:100%}
#app{position:relative;width:min(100%,480px);min-height:100svh;margin:auto;isolation:isolate;overflow-x:hidden;background:linear-gradient(160deg,#26a8eb,#426dcc 55%,#3e248e)}
#app::before{content:"";z-index:-2;inset:0;position:absolute;background:radial-gradient(circle at 75% 5%,#fff8 1px,transparent 2px),radial-gradient(circle at 13% 22%,#fff8 2px,transparent 3px);background-size:97px 91px,163px 157px;opacity:.6}
@media(min-width:600px){
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:radial-gradient(circle,#364e9a,#070c30 70%)}
  #app{height:min(940px,96vh);min-height:0;overflow-y:auto;border:6px solid #293d81;border-radius:33px;box-shadow:0 26px 70px #000b;scrollbar-width:thin;scrollbar-color:#6c8cff55 transparent}
  .screen{min-height:100%}
}
.screen{min-height:100svh;position:relative;padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 26px) max(14px,env(safe-area-inset-left,0px))}
.scene-bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center top;opacity:.85}
.scene-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#061a5266 0,#0b1d5fcc 40%,#0a135af2 100%)}

.top{display:flex;align-items:center;gap:8px;min-height:46px;position:relative;z-index:4}
.iconbtn{height:42px;min-width:42px;border:2px solid #e4faff;border-radius:14px;background:linear-gradient(170deg,#65deff,#2475d9 58%,#1739a4);color:#fff;font-size:19px;box-shadow:inset 0 3px #ffffff62,0 4px 0 #0d2b83}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d2b83}
.player{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#0d2266cc;border:2px solid #9fc4ff66;border-radius:16px;padding:5px 10px}
.lv{font-weight:800;font-size:13px;background:linear-gradient(#ffe38a,#ffab2e);color:#5a2a00;border-radius:9px;padding:1px 7px;white-space:nowrap}
.xp{flex:1;min-width:0}.xp small{display:block;font-size:10px;line-height:1.1;color:#cfe3ff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:#06194e;border:1.5px solid #9cc7ff;border-radius:50px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#42f5e4,#baff52);transition:width .6s}
.coins{border:2px solid #ffe9a0;border-radius:100px;background:linear-gradient(180deg,#2849a2,#122c75);font-weight:800;padding:6px 11px;font-size:15px;white-space:nowrap}
.coins.bump{animation:bump .4s}

.hero{margin:10px 0 8px;position:relative;min-height:240px;border:3px solid #f9dd98;border-radius:28px;background:url('assets/andy_hero.webp') center 20%/cover no-repeat;box-shadow:inset 0 3px #ffffff5e,0 8px 0 #142969,0 13px 25px #070e52b2;overflow:hidden}
.hero::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#03154ae0)}
.hero-title{position:absolute;top:12px;right:12px;text-align:right;z-index:2;display:grid;gap:2px}
.hero-title strong{font-weight:800;font-size:38px;line-height:.85;color:#ffdc54;-webkit-text-stroke:1px #3b2562;text-shadow:0 4px 0 #803f08,0 7px 8px #090d4a;letter-spacing:-.02em}
.hero-title small{font-size:11px;font-weight:800;letter-spacing:.12em;text-shadow:0 2px 4px #021444}
.hero-caption{position:absolute;bottom:12px;left:14px;right:14px;z-index:2;display:flex;align-items:end;justify-content:space-between;gap:8px}
.hero-caption strong{font-size:21px;line-height:1.1;text-shadow:0 3px 4px #070c4e}
.bubble{background:#fff;color:#21396f;border-radius:16px 16px 4px 16px;padding:6px 11px;font-weight:800;font-size:12px;box-shadow:0 3px 8px #0006}
.primary{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid #fff2a3;border-radius:20px;background:linear-gradient(#fff29c,#ffba34 50%,#ff8620);box-shadow:inset 0 4px #fff8,0 6px 0 #aa5216,0 11px 18px #060e496e;color:#5a240a;font-weight:800;font-size:20px;padding:10px 13px}
.primary small{font-size:13px;opacity:.85}
.primary:active,.world-card:active,.answer:active,.node:active{transform:translateY(3px)}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.sec{margin:20px 3px 10px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;text-shadow:0 2px 3px #05174e}
.pill{font-size:11px;letter-spacing:.06em;font-weight:800;border:1px solid #fff9;border-radius:999px;background:#203c93bb;padding:3px 10px;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gift{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px 14px;border-radius:20px;border:3px solid #ffe39a;background:linear-gradient(120deg,#ff5f86,#b14bff);color:#fff;font-weight:800;font-size:16px;text-align:left;box-shadow:0 6px 0 #6a1a6e;animation:pulse 1.6s ease-in-out infinite}
.gift span{font-size:34px;animation:wiggle 1.2s ease-in-out infinite}
.gift small{display:block;font-size:12px;font-weight:600;opacity:.95}
.streak{font-size:12px;font-weight:800;color:#ffd1a1;margin:6px 4px 0;text-align:center}
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grade{min-height:44px;border:2px solid #d9ebff;border-radius:12px;color:#fff;font-weight:800;font-size:17px;background:linear-gradient(#3daeff,#235ed6);box-shadow:inset 0 2px #fff5,0 4px #1d3b91}
.grade.active{border-color:#ffe46c;background:linear-gradient(#ffd85d,#fb8d36);color:#543100;transform:translateY(-2px);box-shadow:0 0 0 3px #ffdc5866,0 5px 0 #a24a16}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world-card{position:relative;min-width:0;height:162px;border:3px solid #e8faff;border-radius:22px;overflow:hidden;text-align:left;background:#142f73;box-shadow:inset 0 2px #fff8,0 6px 0 #082663,0 9px 13px #0007;color:#fff;padding:0}
.world-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.world-card::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#061b53f0)}
.world-card .info{position:absolute;z-index:2;left:10px;right:8px;bottom:8px}
.world-card strong{font-size:17px;display:block;line-height:1.05;text-shadow:0 2px 3px #0009}
.world-card small{display:block;font-size:11px;color:#d4f5ff;font-weight:700}
.world-card .bosschip{position:absolute;z-index:2;top:6px;left:6px;font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1b0b3fcc;border:2px solid #ff8fb1;box-shadow:0 0 12px #ff5f8688}
.world-card .tag{position:absolute;z-index:2;top:8px;right:8px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--mint);color:#063a2a}
.world-card .tag.new{background:var(--gold);color:#5a2a00}
.dots{display:flex;gap:4px;margin-top:3px}.dots i{width:16px;height:6px;border-radius:9px;background:#ffffff40}.dots i.on{background:var(--gold)}
.stars3{letter-spacing:1px;font-size:15px;color:#4a5a99}.stars3 b{color:var(--gold);text-shadow:0 0 6px #ffb800}
.wide{grid-column:1/-1;height:130px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:grid;justify-items:center;gap:2px;text-align:center;padding:9px 4px;border-radius:16px;background:#0d2266bb;border:2px solid #9fc4ff55;font-size:10px;font-weight:700;line-height:1.1;color:#cfe3ff}
.badge span{font-size:26px;line-height:1}
.badge.locked span{filter:grayscale(1) brightness(.5)}.badge.locked{opacity:.6}
.badge.got{border-color:var(--gold);background:linear-gradient(#2c4bb0,#1a2f86);color:#fff}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 15px;color:#fff;border:2px solid #c8dcff;border-radius:14px;background:linear-gradient(#5466c8,#273d9f);box-shadow:0 4px 0 #162361;font-weight:800}
.ghost:active{transform:translateY(2px)}
.ghost.full{width:100%;margin-top:12px}
.ghost.gold{background:linear-gradient(#ffcf4a,#e88a12);color:#4a2200;border-color:#fff2b0;box-shadow:0 4px 0 #8a4a10}
.note{padding:12px 6px 0;text-align:center;color:#cfe0ff;font-size:12px;font-weight:600;line-height:1.45}

/* world map */
.chapter{display:flex;justify-content:center;margin:10px 0 8px}
.chapter span{color:#fff3ce;padding:6px 22px;border-radius:15px;border:3px solid #ffd381;background:linear-gradient(#a96f3a,#744322);box-shadow:inset 0 3px #eeb67c,0 5px 0 #452643;font-weight:800;font-size:21px}
.science .chapter span{background:linear-gradient(#23a4a7,#08707b);border-color:#b1ffff}
.space .chapter span{background:linear-gradient(#7645bb,#452e98);border-color:#d3bbff}
.history .chapter span,.california .chapter span{background:linear-gradient(#c77a2c,#7d4317)}
.art{position:relative;height:170px;border-radius:25px;overflow:hidden;border:2px solid #d9efff;box-shadow:0 8px 17px #060e4388}
.art img{width:100%;height:100%;object-fit:cover}
.art .bubble{position:absolute;top:10px;right:10px;max-width:60%;border-radius:16px 16px 16px 4px}
.path{position:relative;display:grid;gap:14px;margin:16px 0}
.path::before{content:"";position:absolute;left:44px;top:30px;bottom:30px;border-left:4px dashed #ffffff66}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px 12px;border-radius:22px;border:3px solid #e8faff;background:linear-gradient(135deg,#2c58c9,#1a2f86);color:#fff;box-shadow:0 6px 0 #0c1d5c}
.node .enemy{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle,#4b2a85,#1b0b3f);border:3px solid #ffb3c8;box-shadow:0 0 14px #ff5f8666}
.node b{display:block;font-size:17px;line-height:1.1}.node small{display:block;font-size:12px;font-weight:700;color:#d8e8ff}
.node .go{margin-left:auto;font-size:22px}
.node.boss{background:linear-gradient(135deg,#7a1550,#3a0f5e);border-color:#ff8fb1;box-shadow:0 6px 0 #4a0d33,0 0 22px #ff5f8655}
.node.boss .enemy{width:76px;height:76px;font-size:48px;animation:float 2.4s ease-in-out infinite}
.node.locked{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.node.upnext{animation:glow 1.6s ease-in-out infinite}
.node .stars3 b{display:inline;font-size:inherit}
.rules{background:var(--paper);color:var(--ink);border:3px solid #ffe09c;border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 #845529;margin-bottom:6px}
.rules ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rules li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;line-height:1.3}
.rules li span{font-size:22px;width:30px;text-align:center;flex:none}
.rules .vi{margin:10px 0 0;padding-top:9px;border-top:2px dashed #f0d59a;font-size:13px;font-weight:600;color:#5a4a33;line-height:1.45}
.potion{width:100%;margin:10px 0 4px}
.potion.on{background:linear-gradient(#ff8fb1,#e2405f);border-color:#ffe0e8}

/* battle */
.arena{position:relative;margin-top:6px;height:206px;border-radius:24px;overflow:hidden;border:2px solid #cff0ff;box-shadow:0 6px 0 #0a2d72,0 9px 18px #060e5277;background-size:cover;background-position:center 40%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:10px 10px 12px}
.arena::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a1c5a33,#0a1c5acc);transition:background .6s}
.arena.angry::before{background:linear-gradient(180deg,#5a0a1a55,#3a0518dd)}
.arena.shake{animation:shake .4s}
.stagetag{position:absolute;top:8px;left:10px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.06em;background:#0b1550cc;border:1px solid #ffffff66;border-radius:99px;padding:2px 9px}
.fighter{position:relative;display:grid;justify-items:center;gap:5px;z-index:1}
.fighter b{font-size:13px;line-height:1;text-shadow:0 2px 3px #000;white-space:nowrap}
.portrait{width:96px;height:96px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 3px #2f7ee0,0 8px 16px #000a;background:#1b3c8f}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.hero-f .portrait{animation:bob 2.4s ease-in-out infinite}
.bossface{display:grid;place-items:center;font-size:60px;border-color:#ffb3c8;box-shadow:0 0 0 3px #c2185b,0 0 24px #ff5f86aa;background:radial-gradient(circle,#5a1d7a,#22093f);animation:float 2.2s ease-in-out infinite}
.bossface.angry{box-shadow:0 0 0 3px #ff2a2a,0 0 34px #ff2a2a;animation:float 1s ease-in-out infinite;background:radial-gradient(circle,#a3122f,#3a0518)}
.bossface.ko{filter:grayscale(1);transform:rotate(-20deg) scale(.85);animation:none;opacity:.7}
.hearts{font-size:17px;letter-spacing:1px;height:22px}.hearts .lost{filter:grayscale(1);opacity:.35}
.hp{width:100px;height:12px;border-radius:9px;background:#2a0b25;border:2px solid #ffc1d3;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ffb347);transition:width .5s}
.mid{position:relative;z-index:1;align-self:start;display:grid;justify-items:center;gap:6px;width:110px;margin-top:16px}
.robo{font-size:11px;font-weight:700;line-height:1.25;background:#fff;color:#1d2f6b;border-radius:14px;padding:6px 8px;text-align:center;box-shadow:0 3px 8px #0007;min-height:30px}
.robo::before{content:"🤖 "}
.combo{font-weight:800;font-size:18px;color:var(--gold);text-shadow:0 0 10px #ff7a00,0 2px 0 #7a2f00;opacity:0;transform:scale(.6);transition:.25s}
.combo.on{opacity:1;transform:scale(1)}
.fx{position:absolute;z-index:6;font-size:34px;pointer-events:none;left:0;top:0}
.dmg{position:absolute;z-index:7;font-weight:800;font-size:26px;color:#fff;-webkit-text-stroke:1px #8a0030;text-shadow:0 3px 0 #8a0030;pointer-events:none;white-space:nowrap}
.banner{position:absolute;z-index:8;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:26px;white-space:nowrap;color:#fff;background:linear-gradient(90deg,#ff2a55,#ff9a2e);padding:6px 18px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 30px #ff2a55;pointer-events:none}
.track{display:flex;justify-content:center;gap:6px;margin:12px 0 10px}
.track i{width:18px;height:8px;border-radius:9px;background:#ffffff33}
.track i.ok{background:var(--mint)}.track i.no{background:var(--rose)}.track i.now{background:#fff;box-shadow:0 0 8px #fff}
.challenge{background:linear-gradient(155deg,#fffaf0,#f1e9ff);color:var(--ink);border:4px solid #fad99e;border-radius:23px;box-shadow:inset 0 2px 0 #fff,0 7px 0 #97552c,0 11px 18px #050c4e93;padding:12px 12px 15px}
.science .challenge{border-color:#78e8f2;box-shadow:inset 0 2px #fff,0 7px 0 #119caf,0 11px 18px #050c4e93}
.space .challenge{border-color:#d4afff;box-shadow:inset 0 2px #fff,0 7px 0 #7541c0,0 11px 18px #050c4e93}
.eyebrow{font-size:11px;color:#936123;text-align:center;font-weight:800;letter-spacing:.12em}
.question{margin:4px auto 10px;text-align:center;line-height:1.3;font-size:20px;font-weight:800;max-width:36ch;text-wrap:balance}
.speed{height:6px;border-radius:9px;background:#e6dcf5;overflow:hidden;margin:0 0 12px}
.speed i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb800,#ffe066);transform-origin:left;animation:drain 12s linear forwards}
.speed.stop i{animation-play-state:paused}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{position:relative;min-width:0;min-height:68px;border:2px solid #fff;border-radius:16px;color:#132751;background:linear-gradient(180deg,#fff,#bde1ff);box-shadow:inset 0 2px #fff,0 5px 0 #407cb5,0 9px 14px #12378840;font-size:16px;line-height:1.2;font-weight:800;overflow-wrap:anywhere;padding:9px 8px 9px 26px;transition:transform .12s,opacity .2s}
.answer .k{position:absolute;left:7px;top:7px;font-size:11px;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:#13275122;color:#13275199}
.answer:nth-child(2){background:linear-gradient(#fff,#ffcee5);box-shadow:inset 0 2px #fff,0 5px 0 #d26da7}
.answer:nth-child(3){background:linear-gradient(#fff,#c4ffe2);box-shadow:inset 0 2px #fff,0 5px 0 #43aa80}
.answer:nth-child(4){background:linear-gradient(#fff,#fff0a4);box-shadow:inset 0 2px #fff,0 5px 0 #cb9a35}
.answer.correct{background:linear-gradient(#d7ffb4,#73ec88);border:3px solid #1fac68;box-shadow:0 0 20px #56ff8c,0 4px 0 #199c4d}
.answer.wrong{background:linear-gradient(#ffe3e3,#ff8a9a);border:3px solid #f4446c;box-shadow:0 0 16px #ff587b,0 4px 0 #bb3f59;animation:shake .35s}
.answer.gone{opacity:.18;transform:scale(.95)}
.answer.dim{opacity:.55}
.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}

function normalize(raw,g,w){const correct=String(raw[1][raw[2]]),m=raw[6];
 const key=m&&typeof m==='object'?qkey(g,w,m.key):qkey(g,w,raw[0]),topic=m?String(typeof m==='object'?m.topic:m):'';
 return{text:String(raw[0]),key,topic,correct,en:String(raw[3]||''),vi:String(raw[4]||''),hint:String(raw[5]||''),
  options:shuffle(raw[1].map((v,i)=>({v:String(v),ok:i===raw[2]}))),removed:false}}
const GEN={math:window.ANDY_GEN_MATH,english:window.ANDY_GEN_ENGLISH};
function genWeight(g,w){return t=>{const st=P.stats[qkey(g,w,'gen:'+t)];return st&&st.w>st.c?3:st&&st.w>0?1:0}}
function buildRound(n,g=P.grade,w=S.world){const list=(bank[String(g)]||{})[w]||[],gen=GEN[w];
 const nGen=gen?Math.min(n,Math.max(Math.ceil(n*(w==='math'?.6:.5)),n-list.length)):0;
 const scored=list.map(raw=>{const st=P.stats[qkey(g,w,raw[0])]||{c:0,w:0};const tier=st.w>st.c?0:(st.c+st.w===0?1:2+st.c*.1);return{raw,s:tier+Math.random()*.95}});
 scored.sort((a,b)=>a.s-b.s);const raws=scored.slice(0,n-nGen).map(x=>x.raw);
 if(nGen){const seen=new Set(raws.map(r=>r[0]));let tries=0;while(raws.length<n&&tries++<8){gen.generate(g,n,genWeight(g,w)).forEach(r=>{if(raws.length<n&&!seen.has(r[0])){seen.add(r[0]);raws.push(r)}})}}
 return shuffle(raws).map(r=>normalize(r,g,w))}

function shoot(fromEl,toEl,emoji,onHit){const arena=$('#arena');if(!arena||reduce||!fromEl||!toEl){onHit&&onHit();return}
 const ar=arena.getBoundingClientRect(),a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
 const s=document.createElement('span');s.className='fx';s.textContent=emoji;arena.appendChild(s);
 const x1=a.left-ar.left+a.width/2-17,y1=a.top-ar.top+a.height/2-20,x2=b.left-ar.left+b.width/2-17,y2=b.top-ar.top+b.height/2-20;
 s.animate([{transform:`translate(${x1}px,${y1}px) scale(.6) rotate(0)`},{transform:`translate(${(x1+x2)/2}px,${Math.min(y1,y2)-50}px) scale(1.25) rotate(180deg)`},{transform:`translate(${x2}px,${y2}px) scale(1) rotate(360deg)`}],{duration:420,easing:'ease-in'}).onfinish=()=>{s.remove();onHit&&onHit()}}
function knock(el){if(!el||reduce)return;el.animate([{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(9px)',filter:'brightness(2.2)'},{transform:'translateX(-7px)'},{transform:'translateX(0)',filter:'brightness(1)'}],{duration:380})}
function answer(i){if(S.answered||S.page!=='battle')return;const q=S.round[S.qi],o=q.options[i];if(!o||o.gone)return;
 S.answered=true;const ms=performance.now()-S.t0,ok=o.ok,e=enemy();
 const st=P.stats[q.key]||(P.stats[q.key]={c:0,w:0});ok?st.c++:st.w++;S.results[S.qi]=ok;logAnswer(q,ok,ms);
 const btns=[...app.querySelectorAll('.answer')];
 btns.forEach((b,j)=>{b.disabled=true;if(q.options[j].ok){b.classList.add('correct');b.insertAdjacentHTML('beforeend',' ✔')}else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});
 $('.speed')?.classList.add('stop');
 app.querySelectorAll('#tools .tool').forEach(t=>{if(t.dataset.a!=='read')t.disabled=true});
 let gains=[],becameAngry=false;
 if(ok){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);const fast=ms<FAST_MS;if(fast)S.fast++;
  const crit=fast&&S.combo>=4;const dmg=crit?2:1;if(crit)S.crits++;S.hp=Math.max(0,S.hp-dmg);
  if(e.boss&&!S.angry&&S.hp>0&&S.hp<=S.maxHp/2){S.angry=true;becameAngry=true}
  const c=1+(fast?1:0)+(S.combo>=3?1:0),x=10+(fast?5:0)+(S.combo>=3?5:0);P.coins+=c;P.earned+=c;P.xp+=x;S.coinsWon+=c;S.xpWon+=x;
  gains=[`+${c} ⭐`,`+${x} XP`];if(fast)gains.push('⚡ Fast!');if(S.combo>=3)gains.push(`🔥 Combo x${S.combo}`);if(crit)gains.push('💥 Critical!');
  sfx.good(S.combo);try{const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;H&&H.impact({style:'LIGHT'})}catch(e){}
  animClass($('#andy'),'lunge',450);shoot($('#andy'),$('#boss'),crit?'💥':skinEmoji(),()=>{crit?sfx.crit():sfx.hit();knock($('#boss'));floatText($('#boss'),crit?'CRIT -2':'-1',crit?'#ffe066':null,crit);paintArena();$('#coins')?.classList.add('bump');setTimeout(()=>$('#coins')?.classList.remove('bump'),450);
   if(becameAngry){setTimeout(()=>{sfx.roar();bannerText('😡 BOSS IS ANGRY!');buzz(200)},350)}});
  $('#robo').textContent=S.hp<=0?`${e.name} is defeated!`:becameAngry?'Careful! The boss is angry now!':crit?'CRITICAL HIT! Amazing!':pick(PRAISE);
 }else{S.combo=0;S.hearts--;S.missed.push(q);sfx.bad();buzz(120);
  shoot($('#boss'),$('#andy'),'💥',()=>{animClass($('#andy'),'hurt',500);$('#arena')?.classList.add('shake');setTimeout(()=>$('#arena')?.classList.remove('shake'),450);floatText($('#andy'),'-❤️','#ffd0da');paintArena()});
  $('#robo').textContent=S.hearts<=0?'Out of hearts… let’s review!':pick(CHEER)}
 save();
 $('#fbslot').innerHTML=`<div class="feedback ${ok?'':'bad'}" aria-live="polite"><h3>${ok?'🌟 Correct!':'💡 Let’s learn it!'}</h3>
  ${gains.length?`<div class="gains">${gains.map(g=>`<span>${g}</span>`).join('')}</div>`:''}
  ${ok?'':`<p><b>✔ Correct answer:</b> ${esc(q.correct)}</p>`}
  <p><b>Why:</b> ${esc(q.en)}</p><p><b>Ba mẹ (tiếng Việt):</b> ${esc(q.vi)}</p>
  <button class="next" data-a="next">${S.hp<=0?'🏆 VICTORY!':S.hearts<=0?'📚 SEE RESULTS':'▶ NEXT QUESTION'}</button>
  <div class="tools"><button class="tool" data-a="say-en">🔊 Listen (English)</button><button class="tool" data-a="say-vi">🔊 Nghe tiếng Việt</button></div></div>`;
 setTimeout(()=>{const n=$('.next');if(n){n.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});n.focus({preventScroll:true})}},500);
 if(S.hp<=0)setTimeout(()=>{if(!reduce)$('#boss')?.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-25deg)'},{transform:'scale(.85) rotate(-20deg)'}],{duration:600})},500)}
function animClass(el,c,ms){if(!el||reduce)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),ms)}
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function logAnswer(q,ok,ms){const k=today(),d=P.days[k]||(P.days[k]={sec:0,c:0,w:0,s:{}});
 d.sec+=Math.round(Math.min(ms,90000)/1000);ok?d.c++:d.w++;const s=d.s[S.world]||(d.s[S.world]={c:0,w:0});ok?s.c++:s.w++;
 if(q.topic){const t=P.topics[q.topic]||(P.topics[q.topic]={c:0,w:0,world:S.world,g:P.grade});ok?t.c++:t.w++;t.last=k}
 const keys=Object.keys(P.days).sort();while(keys.length>70)delete P.days[keys.shift()]}
function next(){if(!S.answered||S.page!=='battle')return;hush();
 if(S.hp<=0)return finish(true);if(S.hearts<=0)return finish(false);

function fifty(){if(S.answered)return;const q=S.round[S.qi];if(q.removed){toast('Already used on this question');return}

 P.coins-=FIFTY;q.removed=true;save();sfx.coin();
 shuffle(q.options.map((o,i)=>({o,i})).filter(x=>!x.o.ok)).slice(0,2).forEach(({o,i})=>{o.gone=true;const b=app.querySelector(`[data-answer="${i}"]`);if(b){b.classList.add('gone');b.disabled=true}});

 if(win&&S.hearts===1)earn('brave');if(['math','science','history','space'].every(w=>P.worldsWon.includes(w)))earn('explorer');

/* ---------- weekly report (Vietnamese) ---------- */
const VI_DAY=['CN','T2','T3','T4','T5','T6','T7'];
const VI_WORLD={math:'Toán',science:'Khoa học',history:'Lịch sử',english:'Tiếng Anh',space:'Vũ trụ',california:'California'};
const ADVICE={math:'Cùng con làm lại 3–4 bài giống vậy trên giấy, nói to từng bước.',science:'Tìm một video ngắn hoặc thí nghiệm nhỏ ở nhà về chủ đề này.',history:'Hỏi con kể lại sự kiện như một câu chuyện: ai, ở đâu, khi nào, vì sao.',english:'Đọc to câu đúng cùng con và đặt thêm 2 câu mới với từ đó.',space:'Cùng con xem hình hành tinh/bầu trời và nói lại điều vừa học.',california:'Mở bản đồ California và chỉ cho con nơi xảy ra sự kiện.'};
function weekStats(offset){const out={days:[],sec:0,c:0,w:0,s:{},active:0};for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i-offset*7);const k=dayKey(d),v=P.days[k]||{sec:0,c:0,w:0,s:{}};
 out.days.push({k,label:VI_DAY[d.getDay()],sec:v.sec,n:v.c+v.w});out.sec+=v.sec;out.c+=v.c;out.w+=v.w;if(v.c+v.w)out.active++;
 Object.entries(v.s||{}).forEach(([w,x])=>{const o=out.s[w]||(out.s[w]={c:0,w:0});o.c+=x.c;o.w+=x.w})}return out}
function weekText(){const a=weekStats(0),n=a.c+a.w,pct=n?Math.round(a.c/n*100):0,mins=Math.round(a.sec/60);
 const subj=Object.entries(a.s).map(([w,x])=>`${VI_WORLD[w]||w}: ${Math.round(x.c/(x.c+x.w)*100)}% (${x.c+x.w} câu)`).join('; ');
 return `Báo cáo tuần của Andy's Worlds — lớp ${P.grade}\nThời gian học: ${mins} phút trong ${a.active}/7 ngày\nSố câu: ${n} · Đúng: ${pct}%\n${subj?'Theo môn: '+subj+'\n':''}${weakTopics().slice(0,3).map(t=>'Cần ôn: '+t.name+' ('+t.pct+'% đúng)').join('\n')}`}
function weakTopics(){const since=new Date();since.setDate(since.getDate()-13);const sk=dayKey(since);
 return Object.entries(P.topics).filter(([,t])=>t.g===P.grade&&(t.last||'')>=sk&&t.c+t.w>=2).map(([name,t])=>({name,world:t.world,n:t.c+t.w,pct:Math.round(t.c/(t.c+t.w)*100)})).filter(t=>t.pct<75).sort((a,b)=>a.pct-b.pct||b.n-a.n)}
function weeklyHTML(){const a=weekStats(0),b=weekStats(1),n=a.c+a.w,pct=n?Math.round(a.c/n*100):0,mins=Math.round(a.sec/60),bm=Math.round(b.sec/60),bn=b.c+b.w,bp=bn?Math.round(b.c/bn*100):0;

function confetti(){if(reduce)return;const cv=$('#confetti'),ctx=cv.getContext('2d');if(!ctx)return;const W=cv.width=innerWidth,H=cv.height=innerHeight;
 const cols=['#ffd54a','#ff5f86','#4fe3a0','#5ab8ff','#b48cff','#fff'];const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
 const t0=performance.now();(function f(t){const k=(t-t0)/1000;ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-k/3);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(k<3)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})(t0)}

app.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.pname!==undefined){duelCfg().players[Number(t.dataset.pname)].name=t.value.slice(0,12);save()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(S.page==='duel'&&!(e.target&&e.target.matches&&e.target.matches('input'))){const k=e.key.toLowerCase();for(let i=0;i<2;i++){const j=DUEL_KEYS[i].indexOf(k);if(j>=0){e.preventDefault();duelAnswer(i,j);return}}}
 if(!$('#modal').hidden){if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();if(e.key==='Escape'&&chestState&&!chestState.opened)return;modalButton()}return}
 if(S.page==='battle'){if(!S.answered&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1)}
  else if(S.answered&&(e.key==='Enter'||e.key===' ')&&!(document.activeElement&&document.activeElement.matches('.tool'))){e.preventDefault();next()}
  else if(!S.answered&&(e.key==='h'||e.key==='H'))toggleHint()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(S.page==='battle'||(S.page==='duel'&&D&&D.go&&!D.over))musicStart()});
render();
})();
</script>
</body></html>
